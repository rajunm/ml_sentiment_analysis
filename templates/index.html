<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Analysis AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="card">
        <h1>Sentiment AI</h1>
        <p>Powered by Hugging Face Transformers</p>

        <textarea id="textInput" placeholder="Type a sentence here..."></textarea>
        
        <button id="analyzeBtn" onclick="sendToModel()">
            Analyze Sentiment
        </button>

        <div id="resultArea" class="hidden">
            <hr>
            <h2 id="labelDisplay"></h2>
            <p id="scoreDisplay"></p>
        </div>
    </div>

    <script>
        async function sendToModel() {
            // 1. Grab the text from the box
            const userInput = document.getElementById('textInput').value;
            if (!userInput) return alert("Please type something first!");

            // 2. Prepare the data to send (Matches your Flask/Postman format)
            const payload = { "input_text": userInput };

            // 3. Send it to your Flask /predict route
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            // 4. Get the answer back
            const data = await response.json();
            const prediction = data['output text'][0];

            // 5. Show the result on the screen
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('labelDisplay').innerText = prediction.label;
            document.getElementById('scoreDisplay').innerText = "Confidence: " + (prediction.score * 100).toFixed(2) + "%";
            
            // 6. Change color based on result
            const card = document.querySelector('.card');
            card.style.borderTop = prediction.label === "POSITIVE" ? "8px solid #10b981" : "8px solid #f43f5e";
        }
    </script>
</body>
</html>
