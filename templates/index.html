<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Star Sentiment Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Review AI Analyzer</h1>
    <p class="subtitle">Enter text below to detect 5-level sentiment</p>
    
    <textarea id="userInput" placeholder="Write your review or comment here..."></textarea>
    <br>
    <button id="analyzeBtn" onclick="analyzeSentiment()">Analyze Sentiment</button>

    <div id="result-container">
        <div id="emoji-display"></div>
        <p id="label">Result will appear here</p>
        <p id="score"></p>
    </div>
</div>

<script>
    async function analyzeSentiment() {
        const text = document.getElementById('userInput').value;
        const resultContainer = document.getElementById('result-container');
        const labelElement = document.getElementById('label');
        const scoreElement = document.getElementById('score');
        const emojiElement = document.getElementById('emoji-display');
        const btn = document.getElementById('analyzeBtn');

        if (!text.trim()) {
            alert("Please enter some text!");
            return;
        }

        // UI Loading State
        labelElement.innerText = "Analyzing...";
        scoreElement.innerText = "";
        emojiElement.innerText = "⏳";
        resultContainer.style.display = "block";
        resultContainer.className = "loading"; 
        btn.disabled = true;

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            
            const data = await response.json();

            // UI Mapping based on your Python Label Map
            const uiMap = {
                "Very Negative": { class: "v-neg", emoji: "😠" },
                "Negative": { class: "neg", emoji: "🙁" },
                "Neutral": { class: "neu", emoji: "😐" },
                "Positive": { class: "pos", emoji: "🙂" },
                "Very Positive": { class: "v-pos", emoji: "🤩" }
            };

            const config = uiMap[data.label] || { class: "neu", emoji: "❓" };
            
            // Update UI
            emojiElement.innerText = config.emoji;
            labelElement.innerText = data.label;
            scoreElement.innerText = `Confidence: ${(data.score * 100).toFixed(1)}%`;
            resultContainer.className = config.class;

        } catch (error) {
            labelElement.innerText = "Connection Error";
            emojiElement.innerText = "❌";
            console.error(error);
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
